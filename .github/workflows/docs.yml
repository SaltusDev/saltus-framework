name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'bin/**'
      - 'phpdoc.dist.xml'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-php@v4
        with:
          php-version: 8.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install phpDocumentor
        run: |
          wget -q https://github.com/phpDocumentor/phpDocumentor/releases/download/v3.10.0/phpDocumentor.phar
          chmod +x phpDocumentor.phar

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Generate API docs
        run: php phpDocumentor.phar -c phpdoc.dist.xml

      - name: Generate MCP docs
        run: composer docs:mcp

      - name: Install Node dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
